name: pashu_wani
description: "Pashu Wani - Offline-Capable Livestock Health Reporting & Disease Surveillance Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.4.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/ml/
